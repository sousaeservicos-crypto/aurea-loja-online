name: AUREAPlus
options:
  bundleIdPrefix: br.com.aureamais
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  AUREAPlus:
    type: application
    platform: iOS
    sources:
      - path: AUREAPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.aureamais.app
        PRODUCT_NAME: AUREA+
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AUREA+
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
